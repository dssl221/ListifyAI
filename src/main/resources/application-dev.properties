spring.datasource.url=jdbc:h2:mem:listifyai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

server.port=8080
frontend.url=http://127.0.0.1:5173
cors.allowed.origins=http://localhost:5173,http://127.0.0.1:5173
management.health.redis.enabled=false

stripe.price.starter=price_starter_dev
stripe.price.growth=price_growth_dev
stripe.price.pro=price_pro_dev
anthropic.api.key=${ANTHROPIC_API_KEY:dev-anthropic-key}
etsy.api.key=
etsy.access.token=

# Local-only signing material for the development profile. Production has no
# fallback and requires SUPABASE_JWT_SECRET.
supabase.jwt.secret=${SUPABASE_JWT_SECRET:local-development-secret-change-me-32-bytes}

dev.auth.enabled=true
dev.auth.email=developer@listifyai.local
dev.auth.admin-email=admin@tagwing.local
