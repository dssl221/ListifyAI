# DataSource
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Anthropic Claude
anthropic.api.key=${ANTHROPIC_API_KEY:dummy_anthropic_key}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
anthropic.max-tokens=${ANTHROPIC_MAX_TOKENS:2048}
# Claude HTTP executor — dedicated thread pool for parallel Claude calls
claude.http.thread.pool.size=${CLAUDE_HTTP_POOL_SIZE:10}
claude.http.thread.pool.max=${CLAUDE_HTTP_POOL_MAX:20}

# Etsy Open API
etsy.api.key=${ETSY_API_KEY:}
etsy.access.token=${ETSY_ACCESS_TOKEN:}

# Supabase JWT
# This is deliberately required. A fallback signing secret would let anybody who
# knows the source configuration mint valid application JWTs.
supabase.jwt.secret=${SUPABASE_JWT_SECRET}
supabase.project.url=${SUPABASE_PROJECT_URL:https://tvytipugdxvnuyyrxoua.supabase.co}
admin.emails=${ADMIN_EMAILS:}
admin.email=${ADMIN_EMAIL:}

# Stripe
stripe.api.key=${STRIPE_API_KEY:dummy_stripe_key}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:dummy_webhook_secret}
stripe.price.starter=${STRIPE_PRICE_STARTER:dummy_starter}
stripe.price.growth=${STRIPE_PRICE_GROWTH:dummy_growth}
stripe.price.pro=${STRIPE_PRICE_PRO:dummy_pro}

# Async Thread Pool
async.thread.pool.size=30
async.thread.pool.max=50
async.thread.pool.queue-capacity=500

# Tomcat thread pool — tune based on Railway instance size
server.tomcat.threads.min-spare=10
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:150}
server.tomcat.accept-count=100

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=ListifyAI-HikariPool

# Resilience4j
resilience4j.circuitbreaker.instances.etsyApi.slidingWindowSize=10
resilience4j.circuitbreaker.instances.etsyApi.failureRateThreshold=50
resilience4j.circuitbreaker.instances.etsyApi.waitDurationInOpenState=120s
resilience4j.circuitbreaker.instances.etsyApi.permittedCallsInHalfOpenState=3

resilience4j.circuitbreaker.instances.claude.slidingWindowSize=10
resilience4j.circuitbreaker.instances.claude.failureRateThreshold=50
resilience4j.circuitbreaker.instances.claude.waitDurationInOpenState=60s
resilience4j.circuitbreaker.instances.claude.permittedCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.claude.recordExceptions=com.listifyai.exception.ClaudeApiException,java.util.concurrent.TimeoutException,java.net.http.HttpTimeoutException,java.io.IOException

resilience4j.retry.instances.claude.maxAttempts=3
resilience4j.retry.instances.claude.waitDuration=2s
resilience4j.retry.instances.claude.enableExponentialBackoff=true
resilience4j.retry.instances.claude.exponentialBackoffMultiplier=2
resilience4j.retry.instances.claude.retryExceptions=com.listifyai.exception.ClaudeApiException,java.util.concurrent.TimeoutException,java.io.IOException,java.net.http.HttpTimeoutException

resilience4j.retry.instances.etsyApi.maxAttempts=3
resilience4j.retry.instances.etsyApi.waitDuration=2s
resilience4j.retry.instances.etsyApi.enableExponentialBackoff=true
resilience4j.retry.instances.etsyApi.exponentialBackoffMultiplier=2
resilience4j.retry.instances.etsyApi.retryExceptions=com.listifyai.exception.EtsyTransientException,java.util.concurrent.TimeoutException,java.io.IOException,java.net.http.HttpTimeoutException

claude.http.connect-timeout=10s
claude.http.request-timeout=45s

# Rate Limiting
rate.limit.requests.per.minute=${RATE_LIMIT_RPM:10}
rate.limit.public-reviews.requests.per.minute=${PUBLIC_REVIEWS_RATE_LIMIT_RPM:3}
rate.limit.trusted-proxies=${RATE_LIMIT_TRUSTED_PROXIES:}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Notifications
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:ListifyAI <alerts@listifyai.app>}

# Monitoring
monitoring.rules.version=1.1
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}

# Sentry
sentry.dsn=${SENTRY_DSN:}
sentry.traces-sample-rate=0.2
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.send-default-pii=false

# Spring Application
spring.application.name=listifyai
server.port=${SERVER_PORT:8080}
